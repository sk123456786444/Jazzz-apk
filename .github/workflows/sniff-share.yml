name: Sniff Share Link

# Actions > Sniff Share Link > Run workflow > JazzDrive share link paste karo
on:
  workflow_dispatch:
    inputs:
      share_url:
        description: 'JazzDrive share link (https://cloud.jazzdrive.com.pk/share/...)'
        required: true

jobs:
  sniff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Sniff the share page
        env:
          SHARE_URL: ${{ inputs.share_url }}
        run: |
          cat > sniff.py <<'SNIFF_EOF'
          import os, re, asyncio, json
          from playwright.async_api import async_playwright

          URL = os.environ["SHARE_URL"].strip()
          MOBILE_UA = ("Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 "
                       "(KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36")

          def redact(s):
              s = re.sub(r"(?<!\d)(?:\+?92|0)3\d{9}(?!\d)", "[NUMBER]", s)
              s = re.sub(r"[\w.+-]+@[\w-]+\.[\w.-]+", "[EMAIL]", s)
              return s

          async def main():
              media, apis, bodies = [], [], []
              async with async_playwright() as p:
                  b = await p.chromium.launch(args=["--no-sandbox", "--autoplay-policy=no-user-gesture-required"])
                  ctx = await b.new_context(viewport={"width": 412, "height": 915}, user_agent=MOBILE_UA, locale="en-US")
                  page = await ctx.new_page()

                  async def on_resp(r):
                      try:
                          req = r.request
                          ct = (r.headers.get("content-type") or "").lower()
                          line = f"{req.method} {r.status} [{req.resource_type}] {ct[:35]} {r.url[:260]}"
                          if ct.startswith(("video", "audio")) or "mpegurl" in ct or req.resource_type == "media":
                              media.append(line)
                          elif req.resource_type in ("xhr", "fetch"):
                              apis.append(line)
                              if "json" in ct and len(bodies) < 8:
                                  txt = await r.text()
                                  bodies.append((r.url[:200], txt[:1200]))
                      except Exception:
                          pass

                  page.on("response", on_resp)
                  await page.goto(URL, wait_until="domcontentloaded", timeout=90000)
                  await asyncio.sleep(7)
                  for sel in ["button:has-text('Accept All')", "text=Accept All"]:
                      try:
                          await page.locator(sel).first.click(timeout=3000); break
                      except Exception:
                          pass
                  await asyncio.sleep(3)
                  try:
                      await page.evaluate("document.querySelectorAll('video').forEach(v => { v.muted = true; v.play().catch(()=>{}); })")
                  except Exception:
                      pass
                  await asyncio.sleep(10)
                  try:
                      videos = await page.evaluate(
                          "() => Array.from(document.querySelectorAll('video, source, iframe')).map(v => "
                          "({tag: v.tagName, src: v.currentSrc || v.src || '', type: v.type || '', ready: v.readyState}))")
                  except Exception:
                      videos = []
                  try: text = (await page.inner_text("body"))[:500]
                  except Exception: text = ""
                  await page.screenshot(path="share.png")
                  await b.close()

              out = ["## Share page sniff", "", f"Page URL: {URL}", "", "### Page text (first 500 chars)", "```", redact(text), "```",
                     "", "### video / source / iframe elements", "```", redact(json.dumps(videos, indent=1)[:2500]), "```",
                     "", f"### Media requests ({len(media)})", "```", redact("\n".join(media[:25]) or "(koi nahi)"), "```",
                     "", f"### API requests ({len(apis)})", "```", redact("\n".join(apis[:40]) or "(koi nahi)"), "```",
                     "", "### JSON responses (pehle 8)"]
              for u, t in bodies:
                  out += [f"**{redact(u)}**", "```", redact(t), "```"]
              open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n".join(out) + "\n")
              print("\n".join(out))

          asyncio.run(main())
          SNIFF_EOF
          python sniff.py

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-screenshot
          path: share.png
          if-no-files-found: ignore
